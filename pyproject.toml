[project]
name = "running-coach"
version = "0.1.0"
description = "A local AI running coach using Ollama and Discord."
requires-python = ">=3.12"

dependencies = [
    "ollama",  "python-dotenv", "openai", "discord.py"
]

[project.optional-dependencies]
dev = [
    "pytest",  "pytest-asyncio"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]